{% extends "base.html" %}{% block content %}<div class="formbox"><h1>{{'Create account' if mode=='register' else 'Login'}}</h1><form method="post">{% if mode=='register' %}<label>Name<input name="name" required></label><label>Phone<input name="phone" placeholder="024..."></label><label>Region<select name="region" required>{% for r in regions %}<option>{{r}}</option>{% endfor %}</select></label>{% endif %}<label>Email<input type="email" name="email" required></label><label>Password<input type="password" name="password" required minlength="6"></label><button class="btn">{{'Create account' if mode=='register' else 'Login'}}</button></form></div>{% endblock %}
