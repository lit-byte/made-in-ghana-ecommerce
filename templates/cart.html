{% extends "base.html" %}{% block content %}<h1>Shopping Cart</h1>{% for p,q,s in items %}<div class="cartrow"><span><b>{{p.name}}</b><br>Qty {{q}}</span><b>GHS {{'%.2f'|format(s)}}</b><form method="post" action="{{url_for('cart_remove',product_id=p.id)}}"><button>Remove</button></form></div>{% else %}<p>Your cart is empty.</p>{% endfor %}{% if items %}<h2>Total: GHS {{'%.2f'|format(total)}}</h2><a class="btn" href="{{url_for('checkout')}}">Checkout</a>{% endif %}{% endblock %}
