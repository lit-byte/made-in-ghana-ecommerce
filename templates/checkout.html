{% extends "base.html" %}{% block content %}<div class="formbox"><h1>Checkout</h1><h2>GHS {{'%.2f'|format(total)}}</h2><form method="post"><label>Phone<input name="phone" value="{{user.phone or ''}}" required></label><label>City/Town<input name="city" required></label><label>Region<select name="region">{% for r in regions %}<option {% if user.region==r %}selected{% endif %}>{{r}}</option>{% endfor %}</select></label><label>Delivery address<textarea name="address" required></textarea></label><label>Payment<select name="payment_method"><option>Mobile Money</option><option>Card</option><option>Cash on Delivery</option></select></label><p class="notice">Payment gateway integration can be enabled with Paystack keys in .env.</p><button class="btn">Place order</button></form></div>{% endblock %}
