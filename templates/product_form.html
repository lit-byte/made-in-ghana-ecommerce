{% extends "base.html" %}{% block content %}<div class="formbox"><h1>Add Ghanaian product</h1><form method="post"><label>Name<input name="name" required></label><label>Category<select name="category_id">{% for c in categories %}<option value="{{c.id}}">{{c.name}}</option>{% endfor %}</select></label><label>Retail price (GHS)<input name="price" type="number" step="0.01" min="0" required></label><label>Wholesale price (GHS, optional)<input name="wholesale_price" type="number" step="0.01" min="0"></label><label>Minimum wholesale quantity<input name="min_wholesale_qty" type="number" min="1" value="5"></label><label>Stock<input name="stock" type="number" min="0" required></label><label>Image URL<input name="image_url" placeholder="https://..."></label><label>Description<textarea name="description" required></textarea></label><p>Origin: <b>Ghana</b> • Region: <b>{{current_user.region}}</b></p><button class="btn">Submit for approval</button></form></div>{% endblock %}
